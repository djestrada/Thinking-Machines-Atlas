summary: Bubeck and colleagues report early experiments (March 2023) with a pre-release version of GPT-4 across diverse tasks, and argue that its breadth and depth of capability justify viewing it as an early, incomplete form of general intelligence. The report is an informal set of examples, not a controlled evaluation.
orig: 'Bubeck, S., Chandrasekaran, V., Eldan, R., Gehrke, J., Horvitz, E., Kamar, E., Lee, P., Lee, Y. T., Li, Y., Lundberg, S., Nori, H., Palangi, H., Ribeiro, M. T., & Zhang, Y. (2023). Sparks of artificial general intelligence: Early experiments with GPT-4. arXiv:2303.12712. https://arxiv.org/abs/2303.12712'
link: https://arxiv.org/abs/2303.12712
further: []
resp:
- Mahowald et al. (2024) take claims of this kind as an example of the “good at language → good at thought” fallacy (see 7.05). https://arxiv.org/abs/2301.06627
- Chollet, F. (2019). On the measure of intelligence. arXiv:1911.01547. Defines intelligence as skill-acquisition efficiency and proposes the ARC benchmark. https://arxiv.org/abs/1911.01547
- Mitchell & Krakauer (2023), PNAS 120(13). https://doi.org/10.1073/pnas.2215907120
- Narayanan, A., & Kapoor, S. (2024). AI Snake Oil. Princeton University Press.
