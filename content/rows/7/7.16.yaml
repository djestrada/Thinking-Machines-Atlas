arg: AI outputs can have content (Cappelen & Dever)
target: Assertion and meaning
scope: AI systems generally
family: F28
summary: 'Cappelen and Dever argue that the outputs of AI systems can mean something and make claims. On externalist theories of meaning, content depends on a speaker’s place in a linguistic community and causal history rather than on inner understanding, so AI outputs can be held to the standards of assertion: we can ask whether what a system says is true.'
orig: 'Cappelen, H., & Dever, J. (2021). Making AI Intelligible: Philosophical Foundations. Oxford University Press (open access). https://academic.oup.com/book/39386'
link: https://academic.oup.com/book/39386
