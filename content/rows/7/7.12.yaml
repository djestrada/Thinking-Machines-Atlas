arg: World models in LLMs
target: Representation; understanding
scope: LLMs
family: F17
summary: 'Probing and intervention studies suggest that models trained only to predict tokens can develop internal representations of the structure behind their data. A model trained on Othello move sequences represents the board state (Li et al. 2023), and Llama-2 models linearly represent places and times (Gurnee & Tegmark 2024). What counts as a “world model” is disputed: these results show structured representations of particular domains, not a general model of the world.'
orig: 'Li, K., Hopkins, A. K., Bau, D., Viégas, F., Pfister, H., & Wattenberg, M. (2023). Emergent world representations: Exploring a sequence model trained on a synthetic task. ICLR 2023 (oral). arXiv:2210.13382. https://arxiv.org/abs/2210.13382 Gurnee, W., & Tegmark, M. (2024). Language models represent space and time. ICLR 2024. arXiv:2310.02207. https://arxiv.org/abs/2310.02207'
link: https://arxiv.org/abs/2210.13382
