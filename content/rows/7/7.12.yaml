resp:
- Gurnee, W., & Tegmark, M. (2024). Language models represent space and time. ICLR 2024. arXiv:2310.02207. Finds linear representations of space and time in Llama-2 models. https://arxiv.org/abs/2310.02207
- Vafa, K., Chen, J. Y., Rambachan, A., Kleinberg, J., & Mullainathan, S. (2024). Evaluating the world model implicit in a generative model. NeurIPS 2024. arXiv:2406.03689. Finds the models’ world models are far less coherent than standard diagnostics suggest. https://arxiv.org/abs/2406.03689
- Nanda, N., Lee, A., & Wattenberg, M. (2023). Emergent linear representations in world models of self-supervised sequence models. BlackboxNLP 2023. Finds that Othello-GPT’s board representation is linear. https://arxiv.org/abs/2309.00941
