id: '7.13'
cluster: '7'
thread: Representation and mechanism
order: 13
stance: Deflationary
arg: Mechanistic interpretability as evidence
target: Understanding; representation
scope: LLMs
family: F17
summary: Reverse-engineering the internal circuits and features of trained models gives direct evidence about what they compute, and may help settle disputes that behavioral tests cannot. Such findings show which computations underlie particular behaviors; they do not by themselves establish understanding or consciousness, and current methods explain only parts of what models do.
