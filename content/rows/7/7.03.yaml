id: '7.03'
cluster: '7'
thread: Meaning and grounding
order: 3
stance: Against
arg: Stochastic parrots
target: Understanding; meaning
scope: LLMs
family: F07
summary: LLMs stitch together linguistic forms according to probabilities, without reference to meaning. Fluent output invites us to project understanding, and the systems carry social and environmental risks.
orig: 'Bender, E. M., Gebru, T., McMillan-Major, A., & Shmitchell, S. (2021). On the dangers of stochastic parrots: Can language models be too big? Proceedings of the 2021 ACM Conference on Fairness, Accountability, and Transparency (FAccT ’21), 610–623. https://doi.org/10.1145/3442188.3445922'
link: https://doi.org/10.1145/3442188.3445922
