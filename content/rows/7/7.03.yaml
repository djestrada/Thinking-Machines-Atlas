- Piantadosi, S. T., & Hill, F. (2022). Meaning without reference in large language models. arXiv:2208.02957 (also NeurIPS 2022 workshop). Argues that LLMs likely capture important aspects of meaning as conceptual role. https://arxiv.org/abs/2208.02957
- 'Sahlgren, M., & Carlsson, F. (2021). The singleton fallacy: Why current critiques of language models miss the point. Frontiers in Artificial Intelligence 4: 682578. Argues the critics assume that meaning and understanding are single uniform phenomena. https://doi.org/10.3389/frai.2021.682578'
