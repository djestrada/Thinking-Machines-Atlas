summary: 'Agüera y Arcas argues that large language models, trained on text alone, show real if partial understanding, including of concepts and of other minds. On his view, “mere statistics” is the wrong contrast: understanding is itself a matter of modelling patterns, and at scale statistics can amount to it. The models’ abilities in dialogue are offered as evidence.'
