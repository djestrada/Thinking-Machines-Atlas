id: '7.10'
cluster: '7'
thread: Capabilities and their limits
order: 10
stance: Against
arg: Expressivity limits of transformers
target: Reasoning; formal competence
scope: LLMs
family: F14
summary: Formal analyses show that fixed-depth transformers cannot compute some functions without growing in size. Some of those limits are relaxed by chain-of-thought generation, so the practical import for LLM reasoning is contested.
