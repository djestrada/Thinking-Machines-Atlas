id: '7.05'
cluster: '7'
thread: Language and thought
order: 5
stance: Deflationary
arg: Formal vs. functional linguistic competence
target: Language; thought
scope: LLMs
family: F04
summary: LLMs are strong at formal linguistic competence (rules and patterns) and uneven at functional competence (using language for reasoning and social tasks). Conflating the two leads to over- or under-attribution.
orig: 'Mahowald, K., Ivanova, A. A., Blank, I. A., Kanwisher, N., Tenenbaum, J. B., & Fedorenko, E. (2024). Dissociating language and thought in large language models. Trends in Cognitive Sciences 28(6): 517–540. https://doi.org/10.1016/j.tics.2024.01.011 (preprint arXiv:2301.06627)'
link: https://doi.org/10.1016/j.tics.2024.01.011
further: []
resp:
- 'The paper’s own conclusion: LLMs are good models of language but incomplete models of human thought.'
- It also targets claims that LLMs show “sparks of artificial general intelligence” (see 7.08).
