summary: 'Farrell, Gopnik, Shalizi and Evans argue that large models should be seen not mainly as intelligent agents but as a new cultural and social technology, like writing, print, markets and bureaucracies: systems that let people draw on what other people have written and done. The important questions are then how these systems will reshape such institutions, not whether they think.'
