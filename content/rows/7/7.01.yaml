- Piantadosi & Hill (2022), arXiv:2208.02957. https://arxiv.org/abs/2208.02957
- 'Sahlgren & Carlsson (2021): they see no theoretical reason why structural knowledge would be insufficient to count as “real” understanding. https://doi.org/10.3389/frai.2021.682578'
- 'Opposing: Bender & Koller (7.02). Harnad, S. (2025). Language writ large: LLMs, ChatGPT, meaning, and understanding. Frontiers in Artificial Intelligence 7: 1490698 (arXiv:2402.02243, title there: Language Writ Large: LLMs, ChatGPT, Grounding, Meaning and Understanding). Argues that LLMs lack direct sensorimotor grounding. https://doi.org/10.3389/frai.2024.1490698'
