id: '7.01'
cluster: '7'
thread: Meaning and grounding
order: 1
stance: For
arg: Distributional semantics as meaning
target: Meaning
scope: LLMs
family: F07
summary: Much of what meaning consists in may be recoverable from patterns of use, so models trained on text can acquire substantial semantic competence without sensory grounding.
orig: 'Harris, Z. S. (1954). Distributional structure. Word 10(2–3): 146–162. https://doi.org/10.1080/00437956.1954.11659520 Firth, J. R. (1957). A synopsis of linguistic theory, 1930–1955, in Studies in Linguistic Analysis, Blackwell. Copy: https://languagelog.ldc.upenn.edu/myl/Firth1957.pdf Wittgenstein, L. (1953). Philosophical Investigations. Boleda (2020) cites Harris (1954) as the source of the distributional hypothesis.'
link: https://doi.org/10.1080/00437956.1954.11659520
