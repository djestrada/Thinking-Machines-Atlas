summary: If the interrogator or the human foil had telepathic powers, the imitation game would be compromised. Turing took the statistical evidence for telepathy seriously and proposed a telepathy-proof room.
orig: Turing (1950), §6, objection (9). https://doi.org/10.1093/mind/LIX.236.433
