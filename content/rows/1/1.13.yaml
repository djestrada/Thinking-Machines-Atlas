id: '1.13'
cluster: '1'
thread: Is behavior enough? Later critiques
order: 13
stance: For
arg: Total Turing Test (TTT)
target: Mind / cognition; symbol grounding
scope: Machines generally (robots)
family: F01
summary: A verbal-only test can in principle be passed by a mindless symbol-manipulator, and it underdetermines the theory. The adequate criterion is indistinguishability from a person across our whole performance capacity, linguistic and robotic (perceiving, identifying, manipulating, describing real objects). This also suggests how symbols could be grounded (Cluster 2). Harnad adds that no Turing test can guarantee that a body has a mind; testing can only explain the body’s capacities.
orig: 'Harnad, S. (1991). Other bodies, other minds: A machine incarnation of an old philosophical problem. Minds and Machines, 1, 43–54. https://doi.org/10.1007/BF00360578'
link: https://doi.org/10.1007/BF00360578
further:
- 'Schweizer (1998), “The truly total Turing test,” Minds and Machines 8: 263–272.'
resp:
- 'Harnad’s own concession: even total testing explains the body and its capacities, not felt experience (see abstract: https://eprints.soton.ac.uk/253379/).'
- 'Hauser (1993), “Reaping the whirlwind: Reply to Harnad’s ‘Other bodies, other minds’,” Minds and Machines 3: 219–237.'
note: Text-only LLMs fail the TTT by design. Multimodal and robotic systems raise the question of whether adding a body or sensors would change the verdict, a bridge to Cluster 4.
see_also:
