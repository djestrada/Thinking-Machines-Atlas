id: '1.04'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 4
stance: Against
arg: The mathematical objection (Turing’s objection 3)
target: Thinking; limits of machines
scope: Digital computers (discrete-state machines)
family: F14
summary: Results in mathematical logic (Gödel, Church, Turing) show that any discrete-state machine has questions it cannot answer correctly, so machines are limited in ways minds are said not to be. Turing replies that no one has shown humans are free of such limits, that humans often give wrong answers too, and that a single machine’s limits do not show any superiority of human intellect.
orig: Turing (1950), §6, objection (3). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
