id: '1.15'
cluster: '1'
thread: Behavioral evidence in practice
order: 15
stance: Against
arg: ELIZA effect
target: Understanding; mind (attribution)
scope: Computers generally; prominent for LLMs
family: F02
summary: People readily attribute understanding and emotion to a system that merely pattern-matches and reflects their words back. The effect shows that human judgments of machine understanding are easily induced by superficial features, so apparent conversational competence is weak evidence of any inner competence. Weizenbaum used his program to prompt a reevaluation of just such impressions.
orig: 'Weizenbaum, J. (1966). ELIZA: A computer program for the study of natural language communication between man and machine. Communications of the ACM, 9(1), 36–45. https://doi.org/10.1145/365153.365168'
link: https://doi.org/10.1145/365153.365168
further:
- Weizenbaum (1976), Computer Power and Human Reason, W. H. Freeman.
- Hofstadter (1995), Fluid Concepts and Creative Analogies, Basic Books. Discusses the “Eliza effect.”
- Jones & Bergen (2025) use ELIZA as a baseline in their LLM Turing test. https://arxiv.org/abs/2503.23674
resp:
- 'Jones & Bergen (2025): in a controlled three-party design, ELIZA and GPT-4o without a persona prompt were detected well below GPT-4.5 with one, so LLM performance is not just ELIZA-style credulity. An empirical reply to the strongest form of the worry, not a refutation of it.'
note: LLMs are the first systems for which the ELIZA effect cannot be dismissed by pointing at a trivially simple mechanism, but the same psychological susceptibility may still inflate attributions.
see_also:
