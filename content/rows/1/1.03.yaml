id: '1.03'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 3
stance: Against
arg: Heads-in-the-sand objection
target: Consequences of machine thought
scope: Machines generally
family: F26
summary: The consequences of machines thinking would be too dreadful, so let us hope and believe that they cannot. Turing regards this as a source of consolation rather than a real argument.
orig: Turing (1950), §6, objection (2). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
further:
- Fear-driven resistance recurs in public debate on AI; arguments about risk proper are in cluster 11.
resp:
- 'Turing (1950), §6(2): not worth refuting, a matter for consolation.'
note: Shows how denial can be motivated by consequences rather than evidence, which bears on the AI-effect dispute (1.16).
see_also:
- '1.16'
