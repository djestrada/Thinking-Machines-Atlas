id: '1.07'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 7
stance: Against
arg: Arguments from various disabilities
target: Intelligence; mind
scope: Digital computers
family: F03
summary: The claim takes the form “a machine can never do X”, with X ranging from being kind or having a sense of humor to falling in love, learning from experience, or doing something genuinely new. Turing treats these as unsupported inductions from the limited machines we have seen, and in many cases as disguised versions of the argument from consciousness.
orig: Turing (1950), §6, objection (5). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
further: []
resp:
- 'Turing (1950), §6(5): induction from observed machines is weak; many alleged disabilities reduce to consciousness (1.05) or the Lovelace objection (1.08).'
note: Many items on Turing’s list are now routine for LLM-based systems, which changes the evidential force of the argument, though not whether the underlying performance is understanding.
see_also:
- '1.05'
