id: '1.17'
cluster: '1'
thread: Behavioral evidence in practice
order: 17
stance: For
arg: Winograd Schema Challenge and its “defeat”
target: Commonsense understanding
scope: Digital computers; LLMs
family: F01
summary: Levesque proposed pairs of sentences whose pronoun reference can be resolved only with commonsense knowledge, as a more objective and less gameable alternative to the Turing test. By around 2019 large pretrained language models reached above 90% accuracy on versions of the task, prompting the question of what such surrogate tasks measure.
orig: |-
  Levesque, H. J., Davis, E., & Morgenstern, L. (2012). The Winograd schema challenge. Proceedings of the 13th International Conference on Principles of Knowledge Representation and Reasoning (KR 2012), 552–561. https://aaai.org/ocs/index.php/KR/KR12/paper/view/4492 (author’s copy: https://cs.nyu.edu/~ed1/papers/WSKR2012.pdf)
  Levesque, H. J. (2014). On our best behaviour. Artificial Intelligence, 212, 27–35.
link: https://aaai.org/ocs/index.php/KR/KR12/paper/view/4492
further:
- 'Kocijan, Davis, Lukasiewicz, Marcus & Morgenstern (2023), “The defeat of the Winograd schema challenge,” Artificial Intelligence 325: 103971. https://doi.org/10.1016/j.artint.2023.103971 (preprint: https://arxiv.org/abs/2201.02387)'
resp:
- 'Kocijan et al. (2023): the outcome is framed as a lesson about surrogate tasks, not as evidence of human-level commonsense.'
- See 1.18 for the main objection to inferring competence from benchmark success.
note: Results on the challenge are task-specific evidence about behavior, not a demonstration of general commonsense understanding. A clear case of a proposed “better test” that LLMs satisfied without settling the underlying question, which strengthens the case for the AI-effect and shortcut worries (1.18, 1.16).
