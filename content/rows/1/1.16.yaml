id: '1.16'
cluster: '1'
thread: Behavioral evidence in practice
order: 16
stance: For
arg: The AI effect (moving goalposts)
target: Intelligence (concept of)
scope: Digital computers; LLMs
family: F04
summary: Whenever AI accomplishes something once thought to need intelligence (chess, translation, conversation), the accomplishment is reclassified as “mere computation”. On this view skeptics keep shifting the criterion for intelligence, so the denial of machine intelligence is unfalsifiable in practice.
orig: |-
  McCorduck, P. (2004). Machines who think (2nd ed.). A K Peters.
  Hofstadter, D. R. (1979). Gödel, Escher, Bach. Basic Books (“Tesler’s theorem”).
link: ''
further:
- 'Hauser (2001), “Look who’s moving the goal posts now,” Minds and Machines 11: 41–51.'
resp:
- 'A common reply: early proxies such as chess and conversation proved poor measures, so revising the criteria was rational rather than evasive. See 1.12, 1.18, 1.17.'
note: Stance is For because the argument targets the skeptic’s grounds for denial; it does not by itself show that any behavior is enough for thought. The current debate over whether LLMs “really” understand is a prime case of this dispute, and a good prompt for asking what evidence could count against machine understanding.
see_also:
- '1.01'
- '1.18'
