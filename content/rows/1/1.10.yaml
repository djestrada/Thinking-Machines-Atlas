id: '1.10'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 10
stance: Against
arg: Argument from informality of behavior
target: Rule-governed behavior
scope: Digital computers
family: F15
summary: No set of rules could cover every circumstance of human life, so humans are not machines, since machines follow rules. Turing distinguishes rules of conduct from laws of behavior, and notes that we cannot be sure there are no complete laws of behavior.
orig: Turing (1950), §6, objection (8). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
further:
- Descendants in Dreyfus’s critique (4.02) and the frame problem (3.05).
resp:
- 'Turing (1950), §6(8): the distinction between rules of conduct and laws of behavior.'
- Connectionist replies, on which behavior need not be governed by explicit rules.
note: Useful bridge from Turing’s list to the embodiment and frame-problem clusters.
