id: '1.09'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 9
stance: Against
arg: Argument from continuity in the nervous system
target: Simulability
scope: Digital computers
family: F13
summary: The nervous system is continuous while a digital computer is a discrete-state machine, so a digital computer cannot imitate it. Turing replies that a digital machine can approximate a continuous machine closely enough that an interrogator could not exploit the difference.
orig: Turing (1950), §6, objection (7). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
further:
- Maley, C. J. (2011). Analog and digital, continuous and discrete. Philosophical Studies 155.
resp:
- Turing (1950), §6(7), using the differential analyser as an example.
- 'Whether analog computation goes beyond Turing computability: see 3.03 (hypercomputation).'
note: Echoes current disputes over neuromorphic and analog hardware (see 5.06).
see_also:
- '3.03'
- '5.06'
