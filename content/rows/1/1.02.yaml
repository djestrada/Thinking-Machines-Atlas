id: '1.02'
cluster: '1'
thread: Turing’s nine objections (1950)
order: 2
stance: Against
arg: Theological objection
target: Thinking (soul)
scope: Machines generally
family: F26
summary: Thinking is a function of man’s immortal soul, which God has given to humans and not to animals or machines, so no machine can think. Turing replies that the argument unduly limits God’s omnipotence and compares it to earlier religious objections to scientific claims.
orig: Turing (1950), §6, objection (1). https://doi.org/10.1093/mind/LIX.236.433
link: https://doi.org/10.1093/mind/LIX.236.433
further: []
resp:
- 'Turing (1950), §6(1): the reply from divine omnipotence and the comparison with earlier religious objections.'
- Materialist and functionalist replies in Cluster 5.
note: Recurs in public discussion of AI and the soul, and relates to claims that something non-physical is required for mind.
