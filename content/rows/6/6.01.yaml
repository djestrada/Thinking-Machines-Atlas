id: '6.01'
cluster: '6'
thread: The hard problem and its arguments
order: 1
stance: Against
arg: What it is like to be a bat
target: Consciousness; subjectivity
scope: Machines generally
family: F03
summary: Consciousness involves a subjective point of view that objective, third-personal accounts cannot capture, which makes it unclear how we could know what it is like to be a given machine.
orig: 'Nagel, T. (1974). What is it like to be a bat? Philosophical Review 83(4): 435–450. https://www.jstor.org/stable/2183914'
link: https://www.jstor.org/stable/2183914
further: []
resp:
- Akins (1993), What is it like to be boring and myopic?, in Dahlbom (ed.), Dennett and His Critics, Blackwell.
- Dennett (1991), Consciousness Explained.
note: Marked Against because it questions whether objective accounts can capture experience; it does not by itself show that machines cannot be conscious.
see_also: []
todo: Recent discussions applying the question to LLMs.
