arg: Indicator-properties method
target: Consciousness
scope: Current AI
family: F10
summary: Assume computational functionalism as a working hypothesis, derive indicator properties from leading scientific theories of consciousness, and assess AI systems against them. The 2023 report concluded that no current AI system is conscious, but that there are no obvious technical barriers to building systems that meet the indicators.
orig: 'Butlin, P., Long, R., et al. (2023). Consciousness in artificial intelligence: Insights from the science of consciousness. arXiv:2308.08708 (19 authors). https://arxiv.org/abs/2308.08708'
