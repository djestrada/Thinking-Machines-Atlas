thread: The hard problem and its arguments
order: 2
stance: Against
arg: Zombie argument
target: Consciousness
scope: Machines generally
family: F03
summary: 'A being physically (or functionally) just like a conscious human but with no experience at all seems conceivable. If what is conceivable is possible, consciousness is not entailed by physical or functional organization. The idea goes back at least to Stout (1931) and Campbell’s “imitation man” (1970); Kirk (1974) gave early arguments for it and Chalmers (1996) developed the conceivability argument at length. Applied to AI: even a complete functional or physical specification of a machine would leave open whether it has any experience, and its behavior could not settle the question.'
orig: 'Kirk, R. (1974). Zombies v. materialists (symposium with J. E. R. Squires). Proceedings of the Aristotelian Society, Supplementary Volume 48: 135–152. https://academic.oup.com/aristoteliansupp/article-abstract/48/1/135/1779753 Chalmers, D. J. (1996). The Conscious Mind. Oxford UP (ch. 3).'
