arg: Global workspace theory and AI
target: Consciousness
scope: Current AI (some architectures)
family: F10
summary: If consciousness is global broadcast of information within a limited-capacity workspace, then AI systems with the right architecture could be conscious. Some work argues that language agents or deep-learning systems may already approximate parts of this.
orig: 'Baars, B. J. (1988). A Cognitive Theory of Consciousness. Cambridge UP. Dehaene, S., & Naccache, L. (2001). Towards a cognitive neuroscience of consciousness: Basic evidence and a workspace framework. Cognition 79(1–2): 1–37. https://pubmed.ncbi.nlm.nih.gov/11164022/'
