id: '6.03'
cluster: '6'
thread: The hard problem and its arguments
order: 3
stance: Against
arg: Knowledge argument (Mary’s room)
target: Consciousness
scope: Machines generally
family: F03
summary: 'Mary knows all the physical facts about color vision but learns something new on first seeing red, so physical information is not all the information. Applied to AI: knowing everything about how a machine processes colour information would not by itself tell us whether it experiences colour.'
orig: 'Jackson, F. (1982). Epiphenomenal qualia. Philosophical Quarterly 32(127): 127–136. https://doi.org/10.2307/2960077 Jackson, F. (1986). What Mary didn’t know. Journal of Philosophy 83(5): 291–295. Copy: https://openresearch-repository.anu.edu.au/entities/publication/c579f4cd-8f93-4b88-8799-42bdb70be501'
link: https://doi.org/10.2307/2960077
further:
- 'Nida-Rümelin, M., & O Conaill, D. Qualia: The Knowledge Argument. Stanford Encyclopedia of Philosophy. https://plato.stanford.edu/entries/qualia-knowledge/'
resp:
- 'Lewis (1988), What experience teaches; Nemirow (1990): the ability hypothesis.'
- Jackson himself concluded in 1995 that something must be wrong with the argument, and later (2003, 2007) defended a representationalist view on which phenomenal states can be accounted for in physicalist terms.
