id: '6.06'
cluster: '6'
thread: Explaining consciousness or explaining it away?
order: 6
stance: Deflationary
arg: Illusionism and the attention schema
target: Consciousness
scope: Machines generally
family: F09
summary: 'Illusionists (Dennett, Frankish) hold that consciousness as we describe it, with intrinsic phenomenal qualities, is an introspective illusion: there is no such property to explain, only our representation of it. On Graziano’s version, the illusion is produced by a model the brain has of its own attention. Systems with similar self-models might seem conscious to themselves, and the metaphysical question becomes a question about those models.'
orig: 'Dennett, D. C. (1991). Consciousness Explained. Little, Brown. Frankish, K. (2016). Illusionism as a theory of consciousness. Journal of Consciousness Studies 23(11–12): 11–39. Graziano, M. S. A. (2013). Consciousness and the Social Brain. Oxford UP. AI-specific statement: Graziano, M. S. A. (2017). The attention schema theory: A foundation for engineering artificial consciousness. Frontiers in Robotics and AI 4: 60. https://www.frontiersin.org/articles/10.3389/frobt.2017.00060'
