- 'Hindriks, F., & Veluwenkamp, H. (2023). The risks of autonomous machines: From responsibility gaps to control gaps. Synthese 201: 21. Repository record: https://repository.tudelft.nl/record/uuid:b4e47a03-5184-4d93-9b6c-c3eae7a58c45 See also Veluwenkamp, H. (2025). What responsibility gaps are and what they should be. Ethics and Information Technology. https://dc2.philarchive.org/rec/VELWRG'
- 'Santoni de Sio, F., & Mecacci, G. (2021). Four responsibility gaps with artificial intelligence: Why they matter and how to address them. Philosophy & Technology 34: 1057–1084. Distinguish gaps in culpability, moral accountability, public accountability and active responsibility, and argue that designing for meaningful human control can address them. https://doi.org/10.1007/s13347-021-00450-x'
