id: '8.04'
cluster: '8'
thread: Moral agency and responsibility
order: 4
stance: Against
arg: The responsibility gap
target: Moral responsibility
scope: Learning systems; AI
family: F19
summary: 'When a learning system acts in ways its designers cannot foresee or control, no one may be properly responsible, which leaves a gap that undermines accountability. Several things can come apart here: blame, accountability, legal liability, control and foreseeability, and proposed solutions often address some of these but not others.'
orig: 'Matthias, A. (2004). The responsibility gap: Ascribing responsibility for the actions of learning automata. Ethics and Information Technology 6(3): 175–183. https://doi.org/10.1007/s10676-004-3422-1 Sparrow, R. (2007). Killer robots. Journal of Applied Philosophy 24(1): 62–77.'
link: https://doi.org/10.1007/s10676-004-3422-1
