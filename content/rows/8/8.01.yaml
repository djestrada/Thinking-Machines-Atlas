summary: 'Haugeland argues that genuine understanding requires answerability to norms of correctness: a system must be responsible to the world and to others and must care about getting things right. Reliable differential response is not enough, and on his view current machines lack such commitment.'
orig: 'Haugeland, J. (1990). The intentionality all-stars. Philosophical Perspectives 4: 383–427. Haugeland, J. (1998). Having Thought. Harvard UP.'
