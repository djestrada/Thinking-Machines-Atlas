summary: 'Whether goal-directed LLM systems are agents in a robust sense can be treated as a matter of degree along several dimensions: goal-directedness, autonomy, the ability to affect the world directly, long-term planning and acting for reasons. Together these give a system an agency profile, which lets different systems be compared.'
