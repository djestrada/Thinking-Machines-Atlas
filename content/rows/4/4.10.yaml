id: '4.10'
cluster: '4'
thread: Extended mind
order: 10
stance: Deflationary
arg: Extended mind applied to AI (hybrid human–machine cognition)
target: Boundaries of cognition
scope: Machines generally; LLMs
family: F18
summary: Clark argues that generative AI systems can become parts of extended, hybrid human–machine cognitive systems, much as notebooks and other tools can. On this view the question shifts from whether the machine has a mind of its own to how AI reshapes the cognitive systems humans form with it. The argument applies the extended-mind thesis of Clark and Chalmers (1998), which was about tools in general, not AI.
orig: 'Clark, A. (2025). Extending minds with generative AI. Nature Communications. https://www.nature.com/articles/s41467-025-59906-9 Background thesis: Clark, A., & Chalmers, D. J. (1998). The extended mind. Analysis 58(1): 7–19. https://academic.oup.com/analysis/article-abstract/58/1/7/153111'
link: https://www.nature.com/articles/s41467-025-59906-9
