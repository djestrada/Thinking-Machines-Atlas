id: '4.02'
cluster: '4'
thread: Phenomenology and AI
order: 2
stance: Against
arg: Dreyfus’s phenomenological critique
target: Skilled intelligence; background know-how
scope: Digital computers (symbolic AI)
family: F11
summary: Human expertise rests on embodied, situated know-how and a background of practices that cannot be reduced to explicit rules and facts. So rule-based symbol manipulation cannot yield general intelligence.
orig: 'Dreyfus, H. L. (1972). What Computers Can’t Do. Harper & Row. (1992). What Computers Still Can’t Do. MIT Press. Later restatement: Dreyfus, H. L. (2007). Why Heideggerian AI failed and how fixing it would require making it more Heideggerian. Philosophical Psychology 20(2): 247–268. https://philpapers.org/rec/DREWHA (free copy: https://static1.squarespace.com/static/53f8bd2ee4b0271e3bcc40eb/t/609c97fcb65b6359f28e905d/1620875262459/Why+Heideggerian+AI+Failed+and+How+Fixing+it+Would+Require+Making+it+More+Heideggerian.pdf)'
link: https://philpapers.org/rec/DREWHA
