id: '4.09'
cluster: '4'
thread: Life–mind continuity
order: 9
stance: Against
arg: Beast machine (consciousness from bodily regulation)
target: Consciousness
scope: Computers; LLMs
family: F11
summary: Consciousness is grounded in the brain’s predictive regulation of the body’s internal state, so basic experience may be bound to living, self-maintaining bodies. If so, conscious AI is unlikely along current trajectories, though more plausible for more brain-like or life-like systems.
