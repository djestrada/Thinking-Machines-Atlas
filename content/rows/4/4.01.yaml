id: '4.01'
cluster: '4'
thread: Phenomenology and AI
order: 1
stance: Against
arg: Phenomenology of embodiment (Merleau-Ponty)
target: Perception; skilled action
scope: Digital computers (disembodied systems)
family: F11
summary: Perception and skilled action are structured by a lived body engaged with a world, not by internal representations, so a disembodied symbolic system lacks the basis of this kind of intelligence.
orig: 'Merleau-Ponty, M. (1945). Phénoménologie de la perception. Gallimard (English: Phenomenology of Perception, trans. D. Landes, Routledge, 2012).'
