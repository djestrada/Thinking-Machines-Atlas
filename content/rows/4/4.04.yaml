id: '4.04'
cluster: '4'
thread: Phenomenology and AI
order: 4
stance: For
arg: Heideggerian AI is possible (Wheeler)
target: Cognition; skilled coping
scope: Machines (embodied, embedded robots)
family: F12
summary: Wheeler argues that embodied, embedded cognitive science and robotics carry out Heidegger’s critique of classical AI rather than refuting AI as such. Unlike Dreyfus, he holds that a properly Heideggerian AI is possible, built on dynamic systems with minimal, action-oriented representations.
orig: 'Wheeler, M. (2005). Reconstructing the Cognitive World: The Next Step. MIT Press. Review: https://ndpr.nd.edu/news/reconstructing-the-cognitive-world-the-next-step/'
link: https://ndpr.nd.edu/news/reconstructing-the-cognitive-world-the-next-step/
further: []
resp:
- Dreyfus (2007) responds to Wheeler and others, arguing that Heideggerian AI would have to go further still (see 4.02).
- The NDPR reviewer questions Heidegger’s commitment to naturalism and whether skilled coping excludes rules and representations.
