id: '10.06'
cluster: '10'
thread: Feminist epistemology
order: 6
stance: Against
arg: Gendered knowing in AI (Adam)
target: Knowledge; rationality
scope: Symbolic AI; AI generally
family: F23
summary: Adam uses feminist epistemology to examine the conceptions of the knowing subject, knowledge, rationality and language built into AI. She argues that these conceptions carry a masculine bias, so that gender bias is inscribed in AI systems, and that this reinforces older critiques of the AI project.
orig: 'Adam, A. (1998). Artificial Knowing: Gender and the Thinking Machine. Routledge. https://www.routledge.com/Artificial-Knowing-Gender-and-the-Thinking-Machine/Adam/p/book/9780203005057'
