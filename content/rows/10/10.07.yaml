summary: The human/machine boundary is a historical and political construction, and subjectivity is distributed across humans, animals and machines. Posthumanist accounts challenge the premise that minds are individual possessions.
orig: 'Haraway, D. (1985). A manifesto for cyborgs. Socialist Review 80: 65–108. Hayles, N. K. (1999). How We Became Posthuman. University of Chicago Press. Braidotti, R. (2013). The Posthuman. Polity.'
