thread: Power and political economy
order: 14
stance: Against
arg: The whiteness of AI (Cave & Dihal)
target: Framing
scope: Machines generally
family: F23
summary: Cave and Dihal show that AI is mostly portrayed as white, in humanoid robots, voices, stock images and fiction, and argue that this reflects a long association of whiteness with intelligence, professionalism and power. The portrayal can erase people of colour from imagined futures and reinforce racial hierarchies.
orig: 'Cave, S., & Dihal, K. (2020). The whiteness of AI. Philosophy & Technology 33: 685–703. Copy: https://philarchive.org/archive/CAVTWO'
link: https://philarchive.org/archive/CAVTWO
further: []
resp:
- A possible reply is that these portrayals reflect designers’ and marketers’ choices rather than a deep link between whiteness and intelligence; Cave and Dihal argue the two are entangled.
