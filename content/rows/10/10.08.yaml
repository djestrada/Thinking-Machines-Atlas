id: '10.08'
cluster: '10'
thread: Beyond the human
order: 8
stance: Deflationary
arg: Critique of anthropocentrism and property-based thinking about machines
target: Moral status; mind concepts
scope: Machines generally
family: F08
summary: Gunkel argues that debates about machine agency and patiency have been organized by an exclusive logic that admits only beings with human-like properties (reason, consciousness, sentience), so the answer is fixed before the machine is considered. Drawing on Levinas and Derrida, he proposes thinking otherwise about who or what counts, rather than extending the same criteria to machines.
orig: 'Gunkel, D. J. (2012). The Machine Question: Critical Perspectives on AI, Robots, and Ethics. MIT Press. Review: https://ndpr.nd.edu/news/the-machine-question-critical-perspectives-on-ai-robots-and-ethics/ Gunkel, D. J. (2007). Thinking Otherwise: Philosophy, Communication, Technology. Purdue University Press.'
