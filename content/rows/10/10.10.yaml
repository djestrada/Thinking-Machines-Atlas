id: '10.10'
cluster: '10'
thread: Non-Western perspectives
order: 10
stance: For
arg: Robots have Buddha-nature (Mori)
target: Status of machines; human–machine relations
scope: Robots and machines generally
family: F08
summary: Mori, a robotics engineer, argues from Buddhist premises that Buddha-nature is present in all things, including the machines people build. He also stresses that control runs both ways between people and machines, and treats the human–machine relation as shared rather than as mastery.
orig: 'Mori, M. (1981). The Buddha in the Robot: A Robot Engineer’s Thoughts on Science and Religion. Kosei Publishing (Japanese original 1974). Discussion: https://tricycle.org/article/robot-buddhanature/'
link: https://tricycle.org/article/robot-buddhanature/
further:
- 'Hongladarom, S. (2020). The Ethics of AI and Robotics: A Buddhist Viewpoint. Lexington Books. Proposes “machine enlightenment,” combining ethical and technical excellence, as a norm for AI.'
resp:
- If Buddha-nature is present in everything, it cannot single out machines; Mori’s claim is about how to regard machines, not about what they can do.
