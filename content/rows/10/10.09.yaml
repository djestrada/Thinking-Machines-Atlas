id: '10.09'
cluster: '10'
thread: Non-Western perspectives
order: 9
stance: Deflationary
arg: 'Relational ontologies: Indigenous kinship and Ubuntu'
target: Personhood; kinship
scope: AI and robots
family: F08
summary: Lewis, Arista, Pechawis and Kite draw on Hawaiian, Cree and Lakota ontologies to propose “making kin” with machines, and Mhlambi draws on Ubuntu to argue for a relational account of personhood in AI ethics. Both locate personhood in relations rather than individual capacities. They are particular thinkers drawing on particular traditions, not spokespeople for “non-Western thought” as a whole.
orig: 'Lewis, J. E., Arista, N., Pechawis, A., & Kite, S. (2018). Making kin with the machines. Journal of Design and Science. https://jods.mitpress.mit.edu/pub/lewis-arista-pechawis-kite Mhlambi, S. (2020). From rationality to relationality: Ubuntu as an ethical and human rights framework for artificial intelligence governance. Carr Center Discussion Paper, Harvard. https://cyber.harvard.edu/story/2020-07/rationality-relationality-ubuntu-ethical-and-human-rights-framework-artificial'
link: https://jods.mitpress.mit.edu/pub/lewis-arista-pechawis-kite
further: []
resp:
- 'A common caution: relational ontologies differ across communities and should not be treated as a single non-Western alternative; whether they extend kinship to machines is debated within these traditions.'
