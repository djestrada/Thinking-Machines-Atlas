summary: Jensen and Blok examine how Shinto ideas are invoked as an animist background to Japanese technological culture, and use them to extend actor-network theory. They argue that Shinto cosmograms give non-human entities, machines included, real roles in collective life, which widens the debate beyond European naturalism. This is an analysis of particular practices and ideas, not a description of a single Japanese worldview.
orig: 'Jensen, C. B., & Blok, A. (2013). Techno-animism in Japan: Shinto cosmograms, actor-network theory, and the enabling powers of non-human agencies. Theory, Culture & Society 30(2): 84–115. https://doi.org/10.1177/0263276412456564'
