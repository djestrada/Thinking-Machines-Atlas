summary: Danaher argues that robots could be friends in a meaningful sense. The conditions of Aristotelian friendship, such as mutuality, authenticity and equality, can either be met well enough on the evidence of behavior, or are set so high that many human friendships would fail them too. Robot friendship could therefore have real value, as a complement to human friendship rather than a replacement.
