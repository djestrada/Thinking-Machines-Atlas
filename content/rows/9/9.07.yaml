id: '9.07'
cluster: '9'
thread: Protection, rights and welfare
order: 7
stance: For
arg: AI welfare and precaution
target: Moral status
scope: Current and near-term AI
family: F20
summary: There is a realistic possibility that some AI systems will be conscious or robustly agentic, and so morally significant, in the near future, so developers should assess and prepare for AI welfare now. The authors do not claim that current systems are conscious; they argue that the possibility is realistic enough to warrant preparation.
orig: Long, R., Sebo, J., Butlin, P., Finlinson, K., Fish, K., Harding, J., Pfau, J., Sims, T., Birch, J., & Chalmers, D. (2024). Taking AI welfare seriously. arXiv:2411.00986. https://arxiv.org/abs/2411.00986
link: https://arxiv.org/abs/2411.00986
