id: '9.08'
cluster: '9'
thread: Against treating machines as moral patients
order: 8
stance: Against
arg: Robots should be slaves; patiency is not a virtue
target: Moral status; design ethics
scope: AI and robots
family: F22
summary: In a deliberately provocative argument, Bryson holds that machines are owned artifacts and should be designed as tools. Building systems that deserve moral consideration is an avoidable design mistake that diverts moral concern from humans.
