summary: 'Shulman and Bostrom argue that digital minds could come to have stronger claims than humans: they might gain more well-being from the same resources, or come to outnumber us. They ask how principles of fairness and democracy would have to change, and argue for planning arrangements that respect both human and digital interests.'
