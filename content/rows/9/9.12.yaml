arg: A moratorium on synthetic phenomenology (Metzinger)
target: Moral status
scope: Machines generally
family: F20
summary: Metzinger argues that we may create artificial systems capable of suffering, possibly in great numbers, before we can recognize it. Because the risk is serious and our understanding poor, he proposes a global moratorium, until 2050, on research that directly aims at or knowingly risks creating artificial consciousness.
orig: 'Metzinger, T. (2021). Artificial suffering: An argument for a global moratorium on synthetic phenomenology. Journal of Artificial Intelligence and Consciousness 8(1): 43–66. Copy: https://philarchive.org/archive/METASA-4'
