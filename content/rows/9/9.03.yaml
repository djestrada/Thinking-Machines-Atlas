id: '9.03'
cluster: '9'
thread: What grounds moral status
order: 3
stance: Deflationary
arg: Social-relational approaches to moral status
target: Moral status
scope: Machines generally
family: F08
summary: Coeckelbergh argues that moral status is not an intrinsic property to be discovered but is constituted in social relations and practices, so the question is how we relate to machines, not what hidden property they have. Gunkel’s Robot Rights (2018) develops a related view.
orig: 'Coeckelbergh, M. (2010). Robot rights? Towards a social-relational justification of moral consideration. Ethics and Information Technology 12: 209–221. https://doi.org/10.1007/s10676-010-9235-5 Gunkel, D. J. (2018). Robot Rights. MIT Press.'
