id: '9.01'
cluster: '9'
thread: What grounds moral status
order: 1
stance: For
arg: Sentientism
target: Moral status
scope: Machines generally
family: F20
summary: Moral status depends on the capacity for experience, especially suffering. If an AI system is sentient, it has moral status, whatever its substrate.
orig: 'Bentham, J. (1789). An Introduction to the Principles of Morals and Legislation. Singer, P. (1975). Animal Liberation. Random House. Free text of Bentham: https://www.econlib.org/library/Bentham/bnthPML.html'
link: https://www.econlib.org/library/Bentham/bnthPML.html
further: []
resp:
- 'Kantian views that ground moral status in rational agency: see 9.02.'
- 'Korsgaard, C. M. (2018). Fellow Creatures: Our Obligations to the Other Animals. Oxford UP. A Kantian who argues that animals, not only rational agents, are ends in themselves.'
- 'Warren, M. A. (1997). Moral Status: Obligations to Persons and Other Living Things. Oxford UP. Argues that no single property, sentience included, settles moral status, and proposes several criteria.'
