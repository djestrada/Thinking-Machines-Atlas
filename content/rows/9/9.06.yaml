arg: Full rights dilemma and the excluded middle
target: Moral status
scope: AI of debatable personhood
family: F20
summary: 'If AI systems of debatable moral personhood are built, we face a dilemma: granting them full rights risks costs to humans, and denying them risks serious wrong. The authors recommend avoiding systems in the debatable zone.'
orig: 'Schwitzgebel, E., & Garza, M. (2015). A defense of the rights of artificial intelligences. Midwest Studies in Philosophy 39: 98–119. https://doi.org/10.1111/misp.12032 Schwitzgebel, E. (2023). The full rights dilemma for A.I. systems of debatable personhood. https://faculty.ucr.edu/~eschwitz/SchwitzAbs/FullRightsDilemma (preprint: https://arxiv.org/abs/2303.17509) Author’s page: https://faculty.ucr.edu/~eschwitz/SchwitzAbs/AIRights.htm'
