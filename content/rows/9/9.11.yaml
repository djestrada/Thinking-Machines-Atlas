summary: 'Sparrow and Sparrow argue that using robots for the care and companionship of older people is ethically troubling: the comfort they give depends on people being deceived, or deceiving themselves, about what the machine is, and it risks reducing the human contact that care requires. The same worry now applies to AI companion apps.'
orig: 'Sparrow, R., & Sparrow, L. (2006). In the hands of machines? The future of aged care. Minds and Machines 16: 141–161. https://doi.org/10.1007/s11023-006-9030-6 (author’s copy: https://robsparrow.com/wp-content/uploads/2006-Sparrow-In-The-Hands-Of-Machines.pdf)'
