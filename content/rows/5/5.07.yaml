id: '5.07'
cluster: '5'
thread: What it is to implement a computation
order: 7
stance: Against
arg: Universal realizability (triviality of computation)
target: Computation
scope: Digital computers
family: F05
summary: If computation is defined by mapping physical states onto formal states, nearly any sufficiently complex physical system implements nearly any computation, so “the brain implements program P” is trivially true and explains nothing.
orig: 'Putnam, H. (1988). Representation and Reality. MIT Press (appendix: every ordinary open system realizes every abstract finite automaton). Searle (1990), Is the brain a digital computer? (see 2.09). https://philpapers.org/rec/SEAITB-2'
link: https://philpapers.org/rec/SEAITB-2
further: []
resp:
- 'Chalmers, D. J. (1996). Does a rock implement every finite-state automaton? Synthese 108(3): 309–333. Answers Putnam with a stricter, counterfactual account of implementation. https://consc.net/papers/rock.html'
- 'Shagrir (2006): see 2.09.'
- 'Piccinini, G. (2015). Physical Computation: A Mechanistic Account. Oxford UP. (Reviewed by Shagrir and by Rescorla: https://philsci-archive.pitt.edu/24297/)'
