id: '5.05'
cluster: '5'
thread: Biology and physical substrate
order: 5
stance: Against
arg: Biological naturalism
target: Consciousness; intentionality
scope: Computers
family: F13
summary: Consciousness and intentionality are caused by specific biological processes in brains, as digestion is caused by stomachs. Simulating those processes on a computer no more creates consciousness than simulating digestion digests anything.
orig: Searle, J. R. (1980). Minds, brains, and programs (see 2.01). Searle, J. R. (1992). The Rediscovery of the Mind. MIT Press. Searle, J. R. (1995). The mystery of consciousness. New York Review of Books, 2 November 1995.
