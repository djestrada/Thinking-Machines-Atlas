thread: Thought experiments about functional duplicates
order: 4.5
stance: Against
arg: The harder problem of consciousness (Block)
target: Consciousness
scope: Machines generally
family: F03
summary: Block imagines Commander Data, a robot like us at the level of everyday psychology but physically very different. If consciousness is a physical property, as naturalists who take experience seriously hold, we seem to have no conception of evidence that could tell whether Data shares it; if it is a functional property, Data has it. So for a functional duplicate on a different substrate, the question is not just open but apparently unanswerable. It is marked Against because it doubts that functional similarity gives reason to attribute consciousness, not because it denies that Data could be conscious.
orig: 'Block, N. (2002). The harder problem of consciousness. Journal of Philosophy 99(8): 391–425. Copy: https://philarchive.org/archive/BLOTHP'
