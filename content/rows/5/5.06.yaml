id: '5.06'
cluster: '5'
thread: Biology and physical substrate
order: 6
stance: Against
arg: IIT’s verdict on digital hardware
target: Consciousness
scope: Digital computers; current AI
family: F13
summary: On integrated information theory (in its recent versions, IIT 3.0 and 4.0), consciousness is a system’s intrinsic cause–effect structure, not its computation. By IIT’s own measures, conventional digital hardware has very little integrated cause–effect structure whatever software it runs, so on this theory a computer simulating a brain would not be conscious, though neuromorphic hardware with the right physical structure could be. The verdict depends on IIT’s contested axioms and measures.
