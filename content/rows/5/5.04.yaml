id: '5.04'
cluster: '5'
thread: Thought experiments about functional duplicates
order: 4
stance: For
arg: Fading and dancing qualia (organizational invariance)
target: Consciousness
scope: Machines generally
family: F06
summary: Replace neurons one at a time with functional duplicates. If experience faded or flickered while behavior stayed fixed, the subject would be badly wrong about their own experience without noticing. So experience is invariant under functional organization, and a silicon duplicate would be conscious.
orig: Chalmers, D. J. (1995). Absent qualia, fading qualia, dancing qualia. In T. Metzinger (Ed.), Conscious Experience. Imprint Academic. https://consc.net/papers/qualia.html Chalmers, D. J. (1996). The Conscious Mind. Oxford UP (ch. 7).
link: https://consc.net/papers/qualia.html
