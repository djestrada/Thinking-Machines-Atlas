id: '5.03'
cluster: '5'
thread: Thought experiments about functional duplicates
order: 3
stance: Against
arg: China brain (the Chinese nation)
target: Consciousness; qualia
scope: Machines generally
family: F05
summary: Suppose the population of China, linked by radio, implemented a brain’s functional organization for an hour. Intuitively the nation would have no experience, so functional organization alone is not sufficient for mentality.
orig: 'Block, N. (1978). Troubles with functionalism. Minnesota Studies in the Philosophy of Science 9: 261–325 (reprinted in Block, ed., Readings in Philosophy of Psychology, vol. 1, 1980, the edition SEP cites). Excerpt as “The China brain”: https://rintintin.colorado.edu/~vancecd/phil201/Block.pdf'
