summary: Rumelhart, McClelland and the PDP group model cognition as the parallel activity of many simple units whose connection weights are learned, with knowledge distributed across the network rather than stored as explicit symbols. On this view a mind’s organization is closer to a brain-like network than to a symbol system. Today’s deep learning and language models descend from this tradition.
orig: 'Rumelhart, D. E., McClelland, J. L., & the PDP Research Group (1986). Parallel Distributed Processing: Explorations in the Microstructure of Cognition (2 vols.). MIT Press.'
