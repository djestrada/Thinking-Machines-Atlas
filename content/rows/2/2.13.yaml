id: '2.13'
cluster: '2'
thread: Intentionality and grounding
order: 13
stance: Against
arg: The symbol grounding problem
target: Meaning; symbols
scope: Digital computers (symbolic AI); extended to LLMs
family: F07
summary: How can the semantic interpretation of a formal symbol system be intrinsic to the system, rather than parasitic on meanings in our heads? Harnad compares it to learning Chinese from a Chinese/Chinese dictionary alone. His candidate solution is a hybrid in which symbols are grounded bottom-up in iconic and categorical representations of sensory experience, with neural nets doing the grounding.
orig: 'Harnad, S. (1990). The symbol grounding problem. Physica D, 42(1–3), 335–346. https://doi.org/10.1016/0167-2789(90)90087-6 (free copy: https://eprints.soton.ac.uk/250382/)'
link: https://doi.org/10.1016/0167-2789(90)90087-6
further:
- 'Mollo & Millière (2026), The vector grounding problem, Philosophy and the Mind Sciences 7(1): 1–28, https://doi.org/10.33735/phimisci.2026.12307 (arXiv:2304.01481). Extends the problem to LLMs and argues referential grounding is the relevant kind. https://arxiv.org/abs/2304.01481'
- Millière & Buckner (2024), Part I, section on grounding. https://arxiv.org/abs/2401.03910
- 'Taddeo, M., & Floridi, L. (2005). Solving the symbol grounding problem: A critical review of fifteen years of research. Journal of Experimental & Theoretical Artificial Intelligence, 17(4), 419–445. https://philarchive.org/rec/TADSTS'
resp:
- 'Mollo & Millière: some LLMs, particularly those fine-tuned with RLHF, may meet teleosemantic conditions for referential grounding, and multimodality and embodiment are neither necessary nor sufficient.'
- 'Coelho Mollo and Millière summarize their argument on the Brains Blog: https://philosophyofbrains.com/coelho-mollo-and-milliere-on-the-vector-grounding-problem'
- Robot reply (2.04) as an early grounding proposal; Searle’s response is that sensors add only syntax.
note: Probably the most direct bridge between the classical debates and current LLM discussion (Cluster 7), via the vector grounding problem.
see_also:
