id: '2.01'
cluster: '2'
thread: The Chinese Room and the replies (1980)
order: 1
stance: Against
arg: The Chinese Room Argument
target: Understanding; intentionality
scope: Digital computers (programs); now contested for LLMs
family: F05
summary: Searle imagines himself, knowing no Chinese, locked in a room and following a rulebook for manipulating Chinese symbols, so that fluent answers come out. To people outside, the room seems to understand Chinese, but Searle understands none of it. A computer running a program is in the same position, so running a program is never by itself sufficient for understanding or intentionality. Searle concludes that thinking requires causal powers at least equivalent to those of brains; he does not claim that only biological brains, or exact copies of them, could have them.
orig: Searle, J. R. (1980). Minds, brains, and programs. Behavioral and Brain Sciences, 3(3), 417–457 (target article pp. 417–424; open peer commentary; Searle’s reply, “Intrinsic intentionality,” pp. 450–456). https://doi.org/10.1017/S0140525X00005756
link: https://doi.org/10.1017/S0140525X00005756
