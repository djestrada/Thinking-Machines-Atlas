resp:
- 'Systems reply: the whole system understands (2.02); virtual mind reply (2.03).'
- 'Robot reply: add sensors and effectors (2.04).'
- Brain simulator reply and the luminous room (2.05).
- Intuition-pump objection (2.06).
- 'Other minds reply: if we credit other people with understanding on behavioral grounds, we should credit the machine too (1.06). Searle answers that the issue is what it is to have understanding, not how we tell. (as summarized in the SEP and IEP entries).'
- 'Combination reply and many mansions reply: listed in Searle (1980) and the IEP entry (https://iep.utm.edu/chinese-room/).'
- Harnad accepts the argument against computation alone but rejects Searle’s further conclusions (see the Southampton eprint above and 2.13).
note: 'LLMs sharpen the argument rather than settle it: critics say transformers are not rule-following programs of the Chinese Room kind, while defenders say any digital system is still syntax over implementation. Students can ask which premises depend on the architecture.'
