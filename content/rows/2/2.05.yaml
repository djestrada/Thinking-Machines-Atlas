id: '2.05'
cluster: '2'
thread: The Chinese Room and the replies (1980)
order: 5
stance: For
arg: Brain simulator reply (and the Chinese gym / luminous room)
target: Understanding; mind
scope: Digital computers; neural networks
family: F06
summary: Suppose the program does not manipulate symbols about stories but simulates, neuron by neuron, the brain of a native Chinese speaker. Then the machine would work exactly as that brain does, and it would be hard to deny that it understands. Later versions stress parallel, brain-like architectures.
orig: Stated and answered in Searle (1980), BBS 3(3), 417–457 (see pp. 420–421). https://doi.org/10.1017/S0140525X00005756
link: https://doi.org/10.1017/S0140525X00005756
further:
- 'Churchland, P. M., & Churchland, P. S. (1990). Could a machine think? Scientific American 262(1): 32–37. Source of the luminous room reply. https://dc2.philarchive.org/rec/CHUCAM'
- 'Searle, J. R. (1990). Is the brain’s mind a computer program? Scientific American 262(1): 26–31. Source of the Chinese gym. https://www.jstor.org/stable/24996641'
resp:
- 'Searle (1980): imagine the man operating water pipes and valves arranged like the neurons. He still understands nothing; simulating a brain is not duplicating its causal powers. SEP’s section on simulation and duplication discusses this distinction.'
- Searle’s further line, in his 1990 Scientific American piece, is the Chinese gym, a hall of men acting as units of a parallel network.
- 'The Churchlands answer with the luminous room: waving a magnet in a dark room does not show that electromagnetism cannot be light.'
note: Relevant to the claim that LLMs are neural, not symbolic, systems. Searle’s water-pipe reply does not depend on symbols, so it is not obviously blocked by that move.
