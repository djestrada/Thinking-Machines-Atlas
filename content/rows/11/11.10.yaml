arg: Is power-seeking AI an existential risk? (Carlsmith)
target: Risk
scope: Machines generally
family: F24
summary: 'Carlsmith breaks the case into premises: that powerful, agentic, strategically aware systems become possible and are built; that aligning them is hard; that some seek power in high-impact ways; that this escalates to disempowering humanity; and that this would be a catastrophe. He gives a rough probability for each, so readers can see which premise carries the weight.'
