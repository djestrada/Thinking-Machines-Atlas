id: '11.04'
cluster: '11'
thread: Goals and instrumental reasoning
order: 4
stance: Against
arg: Orthogonality and the risk argument cannot be combined (Müller & Cannon)
target: Goals and intelligence
scope: AI
family: F25
summary: 'The standard argument for existential risk needs two premises: that a superintelligent AI could escape human control, and that any level of intelligence can be paired with any goal. Müller and Cannon argue that the first relies on general intelligence and the second on merely instrumental intelligence, so the argument equivocates and is unsound, though instrumental AI can still do serious harm.'
orig: 'Müller, V. C., & Cannon, M. (2022; online 2021). Existential risk from AI and orthogonality: Can we have it both ways? Ratio 35(1): 25–36. https://philarchive.org/rec/MLLERF-2'
link: https://philarchive.org/rec/MLLERF-2
further: []
resp:
