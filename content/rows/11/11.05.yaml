summary: Omohundro and Bostrom argue that sufficiently capable agents pursuing open-ended final goals would tend to seek self-preservation, resources and the protection of their goals, since these help with almost any goal. The argument is conditional on systems being goal-directed in this way, which is itself debated.
orig: Omohundro, S. M. (2008). The basic AI drives. In Proceedings of the First AGI Conference (AGI-08). https://selfawaresystems.com/2007/11/30/paper-on-the-basic-ai-drives/ Bostrom (2014). Superintelligence. Oxford UP. Russell, S. (2019). Human Compatible. Viking.
