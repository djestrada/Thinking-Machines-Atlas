summary: Good argues that an ultraintelligent machine could design better machines, which could design better ones still, so that machine intelligence would rapidly leave human intelligence far behind. Chalmers reconstructs this as an argument whose premises can be assessed separately; whether such a process would be fast, or would happen at all, is disputed.
orig: 'Good, I. J. (1965). Speculations concerning the first ultraintelligent machine. In F. L. Alt & M. Rubinoff (Eds.), Advances in Computers 6: 31–88. Academic Press. Chalmers, D. J. (2010). The singularity: A philosophical analysis. Journal of Consciousness Studies 17(9–10): 7–65. https://consc.net/papers/singularity.pdf'
link: https://consc.net/papers/singularity.pdf
