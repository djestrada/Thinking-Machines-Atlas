arg: The alignment problem
target: Values; control
scope: AI
family: F24
summary: 'It is difficult to specify human values in objectives that a powerful system will pursue faithfully, and misspecified objectives can lead to harm. Gabriel adds that alignment is a normative question as well as a technical one: whose values, given reasonable disagreement? Current systems show milder forms of the problem, such as reward hacking and sycophancy, though these alone do not establish the stronger claims of the risk argument.'
