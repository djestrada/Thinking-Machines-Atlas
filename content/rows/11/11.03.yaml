id: '11.03'
cluster: '11'
thread: Goals and instrumental reasoning
order: 3
stance: For
arg: Orthogonality thesis
target: Goals and intelligence
scope: AI
family: F24
summary: Bostrom argues that intelligence and final goals are independent, so a highly intelligent system could in principle pursue almost any goal. The thesis concerns what is possible, not what is likely.
orig: 'Bostrom, N. (2012). The superintelligent will: Motivation and instrumental rationality in advanced artificial agents. Minds and Machines 22(2): 71–85. https://doi.org/10.1007/s11023-012-9281-3 (author’s copy: https://nickbostrom.com/superintelligentwill.pdf) Bostrom, N. (2014). Superintelligence. Oxford UP.'
