id: '3.05'
cluster: '3'
thread: The frame problem
order: 5
stance: Against
arg: The frame problem
target: Commonsense reasoning; relevance
scope: Digital computers (symbolic AI)
family: F15
summary: A system must update its model of the world after an action without re-checking everything that did not change. Specifying what stays the same is logically and computationally burdensome, and the broader version asks how a system could settle what is relevant at all.
orig: 'McCarthy, J., & Hayes, P. J. (1969). Some philosophical problems from the standpoint of artificial intelligence. Machine Intelligence 4: 463–502. https://www-formal.stanford.edu/jmc/mcchay69.html Philosophical broadening: Dennett, D. C. (1984). Cognitive wheels: The frame problem of AI. In Hookway (Ed.), Minds, Machines and Evolution. Cambridge UP. Fodor, J. A. (1987), in Pylyshyn (Ed.), The Robot’s Dilemma. Ablex.'
link: https://www-formal.stanford.edu/jmc/mcchay69.html
further: []
resp:
- 'Shanahan, M. The Frame Problem. Stanford Encyclopedia of Philosophy. Reviews the logical and philosophical versions and their solutions. https://plato.stanford.edu/entries/frame-problem/ (linked bibliography: https://philpapers.org/sep/frame-problem/)'
- 'Ford & Pylyshyn (Eds.) (1996). The Robot’s Dilemma Revisited: The Frame Problem in Artificial Intelligence. Ablex.'
- Shanahan, M. (1997). Solving the Frame Problem. MIT Press.
- 'Embodied and situated responses: Wheeler (2005), Reconstructing the Cognitive World (see 4.06).'
