resp:
- 'Copeland (SEP) distinguishes the original thesis about effective methods from later extensions to physics and cognition, and warns against conflating them (the “equivalence fallacy”): the thesis alone does not show that cognition is computable. https://plato.stanford.edu/entries/church-turing/'
- 'Searle (1980, 1990): simulation is not duplication; see 2.09 and 2.07.'
- 'Siegelmann, H. T. (1995). Computation beyond the Turing limit. Science 268(5210): 545–548. Analog recurrent networks with real weights exceed Turing computability.'
- 'Copeland, B. J. (2002). Hypercomputation. Minds and Machines 12: 461–502. https://doi.org/10.1023/A:1021105915386; and Copeland (1998), see 3.02.'
- 'Wells (1998), Turing’s analysis of computation and theories of cognitive architecture, Cognitive Science 22(3): 269–294.'
- 'Bringsjord & Zenzen (2003), Superminds: People Harness Hypercomputation, and More, Kluwer. https://link.springer.com/978-1-4020-1094-1'
