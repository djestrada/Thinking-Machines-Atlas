arg: Church–Turing universality
target: Cognition (simulability)
scope: Digital computers
family: F14
summary: Any effectively calculable procedure can be carried out by a universal Turing machine. This is a thesis about computability, not about minds. Whether physical processes, and cognition in particular, are computable is a further question (the physical Church–Turing thesis, which Deutsch formulates for quantum physics). So universality shows only that if cognition is computable, a digital computer could in principle carry it out.
orig: 'Turing, A. M. (1936). On computable numbers, with an application to the Entscheidungsproblem. Proceedings of the London Mathematical Society s2-42(1): 230–265. https://doi.org/10.1112/plms/s2-42.1.230 Deutsch, D. (1985). Quantum theory, the Church–Turing principle and the universal quantum computer. Proceedings of the Royal Society A 400: 97–117. Church, A. (1936). An unsolvable problem of elementary number theory. American Journal of Mathematics 58(2): 345–363. https://doi.org/10.2307/2371045'
link: https://doi.org/10.1112/plms/s2-42.1.230
