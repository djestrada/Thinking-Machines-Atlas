id: '3.02'
cluster: '3'
thread: Gödelian arguments
order: 2
stance: Against
arg: Penrose’s Gödelian argument and quantum consciousness
target: Mathematical understanding; consciousness
scope: Digital computers
family: F14
summary: Penrose argues from Gödel that human mathematical understanding is non-algorithmic, and conjectures that consciousness depends on non-computable physical processes in the brain (developed with Hameroff as Orch OR).
orig: 'Penrose, R. (1989). The Emperor’s New Mind. Oxford University Press. Penrose, R. (1994). Shadows of the Mind. Oxford University Press. Hameroff, S., & Penrose, R. (2014). Consciousness in the universe: A review of the ‘Orch OR’ theory. Physics of Life Reviews 11(1): 39–78. https://pubmed.ncbi.nlm.nih.gov/24070914/'
link: https://pubmed.ncbi.nlm.nih.gov/24070914/
further: []
resp:
- 'Psyche symposium on Shadows of the Mind (Psyche 2, 1995), including Chalmers, Minds, machines, and mathematics (https://consc.net/papers/penrose.html), Feferman, Penrose’s Gödelian argument, and McCarthy, Maudlin and Moravec; Penrose replied in the same symposium. Archive: https://calculemus.org/MathUniversalis/NS/10/03chalmers.html'
- 'Tegmark, M. (2000). Importance of quantum decoherence in brain processes. Physical Review E 61(4): 4194–4206. Argues neural quantum states decohere far too fast to play a cognitive role. https://arxiv.org/abs/quant-ph/9907009'
- 'Copeland, B. J. (1998). Turing’s O-machines, Searle, Penrose and the brain. Analysis 58(2): 128–138.'
- Bringsjord, S., & Xiao, H. A refutation of Penrose’s Gödelian case against artificial intelligence. Journal of Experimental & Theoretical Artificial Intelligence (2000). https://philarchive.org/rec/BRIARO-2
- Penrose’s précis of The Emperor’s New Mind with open peer commentary, Behavioral and Brain Sciences 13(4) (1990).
