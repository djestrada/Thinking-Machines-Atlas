id: '3.04'
cluster: '3'
thread: Computability and complexity
order: 4
stance: Against
arg: Computational intractability of learning human-level cognition
target: Cognition; AGI via machine learning
scope: LLMs and current AI
family: F14
summary: Van Rooij and colleagues prove that, under their formalization of the task, learning human-like cognitive capacities from data is computationally intractable in general. If the formalization fits, scaling learning systems will not by itself yield human-level cognition, and theories of cognition must respect tractability limits. Critics question whether worst-case results of this kind apply to the data and tasks AI systems actually face.
