- - Cole, D. The Chinese Room Argument. Stanford Encyclopedia of Philosophy (revised 2024).
  - Encyclopedia entry
  - Searle’s argument, its historical background, the main replies (systems, robot, brain simulator, other minds, intuition) and larger issues (syntax and semantics, intentionality, simulation vs. duplication).
  - Best single survey for Cluster 2; used to check the list of replies.
  - https://plato.stanford.edu/entries/chinese-room/
  - Checked via search results (entry structure and text); not read in full.
- - Hauser, L. Chinese Room Argument. Internet Encyclopedia of Philosophy.
  - Encyclopedia entry
  - Replies and rejoinders, including the combination and many mansions replies, and a section on the connectionist reply.
  - Complements SEP; useful for the less-discussed replies.
  - https://iep.utm.edu/chinese-room/
