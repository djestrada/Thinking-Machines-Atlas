- - 'Horn, R. E., Yoshimi, J., McBride, R., & Deering, M. (1998). Mapping Great Debates: Can Computers Think? Seven argumentation maps and handbook. MacroVU Inc., Bainbridge Island, WA.'
  - Argument maps
  - Seven large maps tracing more than 800 arguments, rebuttals and counterrebuttals about whether computers can think, by several hundred scholars, in a Toulmin-style format. One map asks whether machines must be conscious in order to think. Later translated into an online debate map (2007).
  - The closest direct precedent found. It predates LLMs and later topics (moral status, risk), is static, and does not tag scope. Useful as a completeness check on the classic core of clusters 1–5. See also Horn’s ISSA paper describing the method.
  - https://rozenbergquarterly.com/?p=13887
  - Checked via search results (ISSA paper, a 2007 blog post, a 1999 talk abstract). The maps’ own site (macrovu.com) was seen only as a link in a syllabus; whether it is live is unchecked.
- - 'Dietrich, E., Fields, C., Sullins, J. P., Van Heuveln, B., & Zebrowski, R. (2021). Great Philosophical Objections to Artificial Intelligence: The History and Legacy of the AI Wars. Bloomsbury Academic.'
  - Monograph
  - Surveys the most famous philosophical arguments against building a machine with human-level intelligence, organized as a series of “wars” (consciousness, meaning, the frame problem, rationality and creativity, and others), with a bibliography.
  - Covers the against side in depth for the classic period. Does not cover the for side, the LLM debates, or moral status in the same way.
  - https://www.perlego.com/book/2059613/great-philosophical-objections-to-artificial-intelligence-the-history-and-legacy-of-the-ai-wars-pdf
  - Checked via publisher and library listings; all five authors confirmed on the book’s listing in the link check (19 Nov 2026).
- - Frankish, K., & Ramsey, W. M. (Eds.) (2014). The Cambridge Handbook of Artificial Intelligence. Cambridge University Press.
