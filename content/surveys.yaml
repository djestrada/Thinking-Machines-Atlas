- - 'Müller, V. C. (2024). Philosophy of AI: A structured overview. In N. Smuha (Ed.), Cambridge Handbook on the Law, Ethics and Policy of AI, 1–25. Cambridge University Press. (Reprinted 2025 in Hähnel & Müller (Eds.), A Companion to Applied Philosophy of AI, Wiley.)'
  - Survey chapter
  - Main topics, arguments and positions in philosophy of AI, excluding ethics. A footnote says there are very few surveys and no recent ones, and lists Carter 2007, Copeland 1993, Dietrich 2002, Floridi 2003 and 2011, and Müller 2016.
  - Closest structural overview found, and a good cross-check on cluster choices. It surveys topics rather than cataloguing arguments with sources and responses. Does not cover ethics.
  - https://philarchive.org/rec/MLLPOA
  - Checked via PhilArchive record and draft text.
- - 'Millière, R., & Buckner, C. (2024). A philosophical introduction to language models, Part I: Continuity with classic debates. arXiv:2401.03910.'
  - Opinionated survey
  - 'LLMs in relation to classic debates: compositionality, language acquisition, semantic competence, grounding, world models, cultural transmission.'
  - Directly relevant to Cluster 7 and to how classic arguments (e.g., Blockhead) are applied to LLMs.
  - https://arxiv.org/abs/2401.03910
  - Checked via arXiv listing.
- - 'Millière, R., & Buckner, C. (2024). A philosophical introduction to language models, Part II: The way forward. arXiv:2405.03207.'
