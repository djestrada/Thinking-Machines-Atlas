- - head
  - Caveats
- - text
  - This is a map of a large literature, not a complete bibliography, and the choice of clusters is itself an interpretation. Some traditions, such as phenomenology beyond Dreyfus and non-Western philosophy, are thinly covered.
- - text
  - The table and the Atlas have been reviewed by several AI models working independently, and their corrections are recorded in the Changelog. No review replaces reading the sources. If you find an error, note the row ID and the correction.
- - text
  - 'Scope: this maps the debate about machine minds, not AI ethics as a whole. Bias, surveillance, labor and environmental costs appear where they bear on how the question is framed and whose interests it serves (Q0 and cluster 10).'
