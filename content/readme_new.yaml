- - head
  - Sources and links
- - text
  - 'The Primary link goes to the source named in the row: a free copy where one exists, otherwise the publisher’s page or DOI. Books without a free copy, and paywalled newspaper pieces, have no link. Links were checked against publisher, repository or index records. Page numbers have not been checked.'
