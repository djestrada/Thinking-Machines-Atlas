  - ''
- - head
  - Other tabs
- - text
  - 'Relations: typed links between arguments (responds to, extends, objects to, and so on).'
- - text
  - 'Existing surveys: published overviews of the same ground, including Horn et al.’s 1998 argument maps of the “Can computers think?” debate (cited, not included).'
- - text
  - 'Kernel and Families: an interpretation of the debate’s structure, drafted by Claude. The Kernel names the five questions (Q0 to Q4) that the clusters answer; each Family groups arguments that make the same move in different clusters. Both match the Atlas overview.'
- - text
  - 'Exchanges: the Atlas exchanges as a table. Each has a contested claim and a series of moves that affirm, reframe or deny it. A row’s stance is relative to its cluster’s question, but its side in an exchange is relative to that exchange’s claim, so the two can differ: connectionism is For machine minds but denies that thinking is symbol manipulation.'
- - text
  - 'AI on AI: each AI model’s own assessment, in the same template: the arguments it finds strongest and least convincing, where it lands, and what follows. Models are listed alphabetically, and each entry says how it was collected. Each model is an interested party, and models agreeing does not make them right. Claude built the table and the Atlas, so its picks are the least independent.'
- - text
  - 'Notes on current AI: Claude’s short, unsourced remarks on how individual rows bear on current AI systems.'
- - text
  - 'Verification: three levels of checking. The bibliographic record has been confirmed for every row. The summary has been checked against an abstract, encyclopedia entry or open copy for every row (the “Summary checked?” column); this is not a specialist’s review. Full-text or page-level checking has not been done. Changelog: a dated record of changes.'
