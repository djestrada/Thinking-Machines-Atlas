# Earlier README text still used by the workbook build.
- 'Arguments For and Against Thinking Machines: a study resource'
- 'Status: working draft. Clusters 1 and 2 are drafted at fuller depth (sources checked by search where marked). Clusters 3–10 are a pass 1 sketch (citations from memory, unchecked) with some of the author’s own citations checked. Cluster 11 is bracketed (see below).'
- ''
- How to read the table
- 'Stance: For = supports machine thinking/mind/intelligence; Against = denies or doubts it; Deflationary = dissolves or reframes the question.'
- 'Target: what the argument is about (thinking, understanding, consciousness, intelligence, agency, moral status). Many disputes are really about different targets.'
- 'Scope: Machines generally / Digital computers / LLMs and current AI. Where an argument was written for one scope but is now applied to another, both are noted.'
- 'Editorial note on current AI: Claude’s own synthesis for classroom discussion. It is NOT sourced and should be treated as a prompt for debate, not as scholarship.'
- ''
- Verification legend
- Each row’s Verification column says what was checked. Citations marked [unchecked] were supplied from memory and have NOT yet been confirmed against a publisher, library or repository record; check them before distributing.
- Links point to a DOI, repository or free full-text copy where one was found. Where no working link was verified, the cell says so.
- ''
- Cluster roadmap
- 1. Behavioral and operational criteria (this draft)
- '2. Searle and his critics: computation, meaning and intentionality (title provisional; see Families and Kernel tabs)'
- 3. Formal and computational limits (Lucas–Penrose, Church–Turing, frame problem, complexity)
- 4. Embodiment, enactivism, and life–mind continuity
- 5. Functionalism and substrate (multiple realizability, China brain, qualia arguments, biological naturalism, IIT)
- 6. Consciousness and sentience
- 7. LLM-specific debates (stochastic parrots, octopus test, world models, emergence, simulators)
- 8. Agency, autonomy, and normativity
- 9. Moral status and welfare
- 10. Critical and ideological approaches
- '11. Intelligence explosion, orthogonality, and alignment (bracketed for now: some of these arguments assume machines can think, and others apply whether or not machines are intelligent)'
- ''
- 'Arguments deliberately deferred from Cluster 1: Searle’s Chinese Room (Cluster 2); the argument from informality of behavior and Dreyfus (Cluster 4); Gödelian arguments (Cluster 3); Birch’s “gaming problem” and Schwitzgebel on mimicry (Cluster 6); stochastic parrots and the octopus test (Cluster 7).'
