- Gap check (pass 2, step c)
- 'Existing resources found so far (see Existing surveys): Horn et al. (1998), a set of seven argumentation maps of the “Can computers think?” debate with 800+ arguments; Dietrich et al. (2021), a book-length survey of the objections; Müller (2024), a structured overview; Millière & Buckner (2024) and Mitchell & Krakauer (2023) for LLMs; Cambridge Handbook (2014); and encyclopedia entries.'
- 'What I have not found, in a limited search: a current, source-cited table that covers both sides, includes LLM-era and moral-status debates, and tags each argument’s scope. This is a claim about what I found, not proof that none exists; a further check of recent handbooks and PhilPapers is still to be done.'
