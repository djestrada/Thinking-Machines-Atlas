- Tabs
- Each cluster has its own tab. “Stance” is For / Against / Deflationary and is colour-shaded; use the filter to isolate one side. Rows within a tab are grouped For, then Against, then Deflationary.
- 'Relations: an edge list (from, relation, to) linking arguments within and across clusters. It is meant as raw material for diagrams of the whole structure.'
- 'Existing surveys: scholarly overviews found so far that partly cover the same ground, with notes on how they relate to this table.'
- 'Kernel: a provisional, editorial reading of the top-level questions that the families keep returning to.'
- 'Families: groups of variants of the same argument, with a core claim for each. Each row on a cluster tab names its family. Cluster titles are provisional and may be replaced by debate-based titles once the kernel stabilizes.'
- 'Pass system: pass 1 sketched the canonical arguments and sources from memory; pass 2 (blue column headers) checked citations by search and added links. Every row’s Verification column says what was confirmed and what is still from memory or marked [unchecked]. Where a checked source differed from the pass 1 recollection, the table follows the checked source (for example, Kosinski’s theory-of-mind paper was retitled and published in PNAS in 2024; the reply to Shojaee et al. now lists a single author). Link policy: the Primary link column points to the publisher’s page or DOI wherever one was confirmed; free copies (PhilArchive, author pages, repositories) are given alongside in the source text. Rows whose only version is a preprint or a book say so in the Verification column.'
- Families, Kernel and Relations currently cover clusters 1–2 only and will be extended once more clusters have been checked.
