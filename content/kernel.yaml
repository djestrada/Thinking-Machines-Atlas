- - Alternative framing
  - ''
  - 'Put consciousness first: is phenomenal consciousness the target, and does anything short of it count as understanding? On that framing Searle, Block and Chalmers form the core, and the attributive side looks like a change of subject. The choice between framings is itself part of the debate.'
